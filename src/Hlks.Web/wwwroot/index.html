<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLKS-CAD</title>
  <!-- Modul XR: im Browser der Meta Quest gleich die VR-Startseite (Christian 21.10.2026: «es bleibt ja immer die gleiche adresse auf localhost»).
       Die PC-Oberfläche in der Brille gibt es mit ?oberflaeche=1 (Link unten rechts auf /vr). -->
  <script>if (/OculusBrowser|\bQuest\b/.test(navigator.userAgent) && !/[?&]oberflaeche=1(&|$)/.test(location.search)) location.replace('/vr');</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b6cb0'/%3E%3Cpath d='M7 22V10h3v5h5v-5h3v12h-3v-4h-5v4z' fill='white'/%3E%3Cpath d='M20 22l4-12h2l-4 12z' fill='%23f6ad55'/%3E%3C/svg%3E">
  <!-- Design (hell/dunkel) vor dem ersten Zeichnen setzen, damit nichts flackert -->
  <script src="js/oberflaeche/design-start.js"></script>
  <link rel="stylesheet" href="css/hlks.css">
  <link rel="stylesheet" href="css/oberflaeche.css">
  <link rel="stylesheet" href="css/ansichten.css">
  <link rel="stylesheet" href="css/anordnung.css">
  <link rel="stylesheet" href="css/familien.css">
  <link rel="stylesheet" href="css/familien-unterlagen.css">
  <link rel="stylesheet" href="css/familien-bibliothek.css">
  <link rel="stylesheet" href="css/schema.css">
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/serienpdf.css">
  <link rel="stylesheet" href="css/nachbearbeitung-n3.css">
  <link rel="stylesheet" href="css/ifc-export.css">
  <link rel="stylesheet" href="css/quest.css">
  <link rel="stylesheet" href="css/sanitaer.css">
  <link rel="stylesheet" href="css/planblatt.css">
  <link rel="stylesheet" href="css/projektbrowser.css">
  <link rel="stylesheet" href="css/fensterrahmen.css">
  <link rel="stylesheet" href="css/symbole-revit.css">
  <link rel="stylesheet" href="css/ki-palette.css">
  <link rel="stylesheet" href="css/gesten.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
  </script>
</head>
<body>
  <!-- Aufbau wie Revit: Kopf mit Schnellzugriff, Menüband, Optionsleiste, Andockbereiche links, unten und rechts um die Ansichten
       (Gruppen mit Reitern, frei anordenbar – W2), unten die Statusleiste. Die Paletten (Eigenschaften, Projektbrowser, Koordination …)
       setzt js/oberflaeche/paletten.js in die Bereiche (andocken, als Reiter, schwebend in #palettenschicht); hier stehen nur die leeren
       Bereiche (W1, css/fensterrahmen.css). -->
  <header id="kopf">
    <div id="schnellzugriff"></div>
    <div id="titel">HLKS-CAD</div>
    <div id="kopf-rechts"></div>
  </header>
  <nav id="menueband" aria-label="Menüband"></nav>
  <div id="optionsleiste"></div>
  <main id="arbeitsbereich">
    <aside id="seitenleiste" class="dock" data-bereich="links" aria-label="Paletten links"></aside>
    <div id="seitenleiste-griff" class="dock-griff" data-bereich="links" title="Ziehen zum Verstellen"></div>
    <section id="ansichtsbereich">
      <!-- Die Reiterleisten der Gruppen entstehen in fenster.js innerhalb der Fläche (W2); die erste trägt die Id ansichtsreiter -->
      <div id="ansichtsflaeche"></div>
    </section>
    <div id="dock-unten-griff" class="dock-griff" data-bereich="unten" title="Ziehen zum Verstellen"></div>
    <aside id="dock-unten" class="dock" data-bereich="unten" aria-label="Paletten unten"></aside>
    <div id="dock-rechts-griff" class="dock-griff" data-bereich="rechts" title="Ziehen zum Verstellen"></div>
    <aside id="dock-rechts" class="dock" data-bereich="rechts" aria-label="Paletten rechts"></aside>
  </main>
  <footer id="statusleiste"></footer>
  <div id="palettenschicht"></div>
  <div id="palettenziele"></div>
  <div id="dialogschicht"></div>
  <div id="meldungen" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
