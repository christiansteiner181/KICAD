<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KICAD Baustelle</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,/*KICAD_ICON_SVG*/">
<link rel="apple-touch-icon" href="data:image/png;base64,/*KICAD_ICON_PNG*/">
<meta name="theme-color" content="#16202e">
<meta name="apple-mobile-web-app-title" content="KICAD Baustelle">
<!--KICAD_LIZENZ-->
<style>/*KICAD_STIL*/</style>
</head>
<body>
<header id="kopf">
  <div class="titel"><b id="k-projekt">Projekt</b> <span id="k-rolle" class="rolle"></span></div>
  <div id="k-stand" class="stand"></div>
  <div class="klein" id="k-info"></div>
</header>
<nav id="reiter">
  <button data-reiter="grundriss" class="aktiv">Grundriss</button>
  <button data-reiter="strang">Strangschema</button>
  <button data-reiter="prinzip">Prinzipschema</button>
  <button data-reiter="d3">3D</button>
  <button data-reiter="elemente">Elemente</button>
  <button data-reiter="material">Material</button>
  <button data-reiter="abschnitte">Arbeitsplan</button>
  <button data-reiter="meldungen">Meldungen (<span id="rm-zahl">0</span>)</button>
</nav>
<section id="filter">
  <label>Geschoss <select id="f-geschoss"><option value="">alle</option></select></label>
  <label>Abschnitt <select id="f-abschnitt"><option value="">alle</option></select></label>
  <label>Status <select id="f-status"><option value="">alle</option></select></label>
  <label>Gewerk <select id="f-gewerk"><option value="">alle</option></select></label>
  <label>System <select id="f-system"><option value="">alle</option></select></label>
  <label>Klasse <select id="f-klasse"><option value="">alle</option></select></label>
  <label class="suche">Suche <input id="f-suche" type="search" placeholder="Kennzeichen, Name, Raum"></label>
</section>
<main>
  <div id="ansicht">
    <div id="r-d3" class="reiterinhalt">
      <div id="d3-leiste"><span id="d3-geschosse"></span><label><input type="checkbox" id="d3-ifc" checked> Architekten-IFC</label>
        <button id="d3-alles">Alles zeigen</button></div>
      <div id="d3-flaeche"></div>
    </div>
    <div id="r-plaene" class="reiterinhalt aktiv">
      <div id="plan-leiste"><select id="plan-wahl"></select> <button id="plan-passend">Einpassen</button></div>
      <div id="plan-flaeche"></div>
    </div>
    <div id="r-elemente" class="reiterinhalt"><div class="tabelle" id="el-tabelle"></div></div>
    <div id="r-abschnitte" class="reiterinhalt"><div class="tabelle" id="ab-tabelle"></div></div>
    <div id="r-meldungen" class="reiterinhalt">
      <div class="leiste"><label>Name <input id="rm-person" placeholder="Vorname Name, Firma"></label>
        <button id="rm-senden" hidden>An Projektleitung senden</button> <button id="rm-speichern">Datei speichern</button> <button id="rm-leeren">Alle löschen</button>
        <span class="klein" id="rm-hinweis">Meldungen bleiben in diesem Browser, bis die Datei an die Projektleitung geht. Nichts wird gesendet.</span></div>
      <div class="tabelle" id="rm-tabelle"></div>
    </div>
    <div id="r-material" class="reiterinhalt">
      <div class="leiste"><span id="mat-umfang"></span> <button id="mat-csv">CSV speichern</button></div>
      <div class="tabelle" id="mat-tabelle"></div>
    </div>
  </div>
  <aside id="info"><div class="leer">Element antippen – im 3D, im Plan oder in der Liste.</div></aside>
</main>
<script type="application/json" id="kicad-daten">/*KICAD_DATEN*/</script>
<script type="module">/*KICAD_SKRIPT*/</script>
</body>
</html>
